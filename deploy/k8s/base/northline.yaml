apiVersion: v1
kind: Namespace
metadata:
  name: northline
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: northline
  namespace: northline
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: northline
  namespace: northline
data:
  PORT: "8080"
  DATA_PATH: /data/northline.sqlite
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: northline
  namespace: northline
  labels:
    app: northline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: northline
  template:
    metadata:
      labels:
        app: northline
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: northline
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: northline:local
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: northline
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: northline
  namespace: northline
  labels:
    app: northline
spec:
  selector:
    app: northline
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: northline
  namespace: northline
spec:
  podSelector:
    matchLabels:
      app: northline
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
